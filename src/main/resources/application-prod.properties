server.port=8080
spring.main.banner-mode=off

# --- Secrets (no defaults — fail fast if missing) ---
# User secrets
user.jwt-secret=${USER_JWT_SECRET}
user.mqtt-token-private-key=${USER_MQTT_TOKEN_PRIVATE_KEY}
user.recovery-secret=${USER_RECOVERY_SECRET}

# Device secrets
device.key-secret=${DEVICE_KEY_SECRET}
device.provisioning-secret=${DEVICE_PROVISIONING_SECRET}

# --- MQTT ---
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.topic-wildcard=hydro/+/status

# User MQTT config
user.token-issuer=${USER_TOKEN_ISSUER:hydro-api}
user.access-token-expiration=${USER_ACCESS_TOKEN_EXPIRATION:900000}
user.refresh-token-expiration=${USER_REFRESH_TOKEN_EXPIRATION:2592000000}
user.mqtt-token-expiration=${USER_MQTT_TOKEN_EXPIRATION:600000}

# API MQTT config
api.mqtt-client-id=${API_MQTT_CLIENT_ID:hydro-api-client}
api.mqtt-username=${API_MQTT_USERNAME:hydro-api-user}
api.mqtt-password=${API_MQTT_PASSWORD}

# --- Database ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hydrodb-prod}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false
spring.cache.redis.time-to-live=10m

# --- Hibernate ---
spring.autoconfigure.exclude=\
  org.springframework.modulith.runtime.autoconfigure.SpringModulithRuntimeAutoConfiguration,\
  org.springframework.modulith.actuator.autoconfigure.ApplicationModulesEndpointConfiguration
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# --- Modulith ---
spring.modulith.runtime.verification-enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.jdbc.schema-initialization.enabled=true

# --- Proxy / Reverse proxy awareness ---
server.forward-headers-strategy=framework

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

# --- Blob storage ---
features.blob-storage.enabled=${FEATURE_BLOB_STORAGE_ENABLED:false}

# --- SwaggerUI (disabled in prod) ---
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# --- Logging ---
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=WARN
logging.level.dev.ivfrost.hydro_backend=INFO