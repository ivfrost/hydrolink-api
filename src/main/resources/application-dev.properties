server.port=8080
spring.jmx.enabled=false
spring.main.banner-mode=off

# OAuth2 Cognito
aws.user.pool.id=${AWS_USER_POOL_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION}.amazonaws.com/${AWS_USER_POOL_ID}
spring.security.oauth2.resourceserver.jwt.audiences=${AWS_USER_POOL_CLIENT_ID}

# Docker
spring.docker.compose.enabled=true
spring.docker.compose.readiness.wait=never

# Device secrets
device.key-secret=${DEVICE_KEY_SECRET}
device.provisioning-secret=${DEVICE_PROVISIONING_SECRET}

# --- Database ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true

# --- Redis ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false
spring.cache.type=redis
spring.cache.redis.time-to-live=1m

# --- Hibernate ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# --- Seed Data ---
seed.admin-email=${SEED_ADMIN_EMAIL}
seed.admin-password=${SEED_ADMIN_PASSWORD}
seed.device1-key=${SEED_DEVICE1_KEY}
seed.device2-key=${SEED_DEVICE2_KEY}
seed.device1-secret=${SEED_DEVICE1_SECRET}
seed.device2-secret=${SEED_DEVICE2_SECRET}

# --- Storage ---
minio.url=${MINIO_URL}
minio.ext-url=${MINIO_EXT_URL}
minio.bucket-name=${MINIO_DEFAULT_BUCKETS}
minio.root-user=${MINIO_ROOT_USER}
minio.root-password=${MINIO_ROOT_PASSWORD}

# --- Modulith ---
spring.modulith.runtime.verification-enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.jdbc.schema-initialization.enabled=true

# --- CORS (Vite) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Logging ---
logging.level.org.springframework.web=DEBUG
logging.level.dev.ivfrost.hydro_backend=DEBUG

# AWS
spring.cloud.aws.region.static=${AWS_REGION}
events.queues.device-status-queue=${DEVICE_STATUS_QUEUE}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.account.id=${AWS_ACCOUNT_ID}

# --- Flyway ---
# For squashing migrations, uncomment the following lines to baseline the database on migrate.
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1

