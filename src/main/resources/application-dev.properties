server.port=8080
spring.jmx.enabled=false
spring.main.banner-mode=off

# Docker
spring.docker.compose.enabled=true
spring.docker.compose.readiness.wait=never

# --- Secrets (no defaults — fail fast if missing) ---
# User secrets
user.jwt-secret=${USER_JWT_SECRET}
user.recovery-secret=${USER_RECOVERY_SECRET}

# Device secrets
device.key-secret=${DEVICE_KEY_SECRET}
device.provisioning-secret=${DEVICE_PROVISIONING_SECRET}

# User auth config
user.token-issuer=${USER_TOKEN_ISSUER:hydro-api}
user.access-token-expiration=${USER_ACCESS_TOKEN_EXPIRATION:900000}
user.refresh-token-expiration=${USER_REFRESH_TOKEN_EXPIRATION:2592000000}

# --- Database ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hydrodb-dev}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false
spring.cache.type=redis

# --- Hibernate ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# --- Seed Data ---
seed.admin-email=${SEED_ADMIN_EMAIL}
seed.admin-password=${SEED_ADMIN_PASSWORD}
seed.device1-key=${SEED_DEVICE1_KEY}
seed.device2-key=${SEED_DEVICE2_KEY}
seed.device1-secret=${SEED_DEVICE1_SECRET}
seed.device2-secret=${SEED_DEVICE2_SECRET}

# --- Storage ---
minio.url=${MINIO_URL}
minio.ext-url=${MINIO_EXT_URL}
minio.bucket-name=${MINIO_DEFAULT_BUCKETS}
minio.root-user=${MINIO_ROOT_USER}
minio.root-password=${MINIO_ROOT_PASSWORD}

# --- Modulith ---
spring.modulith.runtime.verification-enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.jdbc.schema-initialization.enabled=true

# --- CORS (Vite) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

# --- Logging ---
logging.level.org.springframework.web=DEBUG
logging.level.dev.ivfrost.hydro_backend=DEBUG

# AWS
spring.cloud.aws.region.static=eu-west-1
events.queues.device-status-queue=hydrolink-device-status
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# --- Flyway ---
# For squashing migrations, uncomment the following lines to baseline the database on migrate.
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1

