services:
  api:
    build:
      context: .
      target: production
    restart: on-failure:3
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      # Device secrets
      DEVICE_KEY_SECRET: ${DEVICE_KEY_SECRET:-${SERVICE_HEX_32_3}}
      DEVICE_PROVISIONING_SECRET: ${DEVICE_PROVISIONING_SECRET:-${SERVICE_HEX_32_11}}

      # OAuth2 Cognito
      AWS_USER_POOL_ID: ${AWS_USER_POOL_ID}
      AWS_USER_POOL_CLIENT_ID: ${AWS_USER_POOL_CLIENT_ID}
      AWS_REGION: ${AWS_REGION}

      # AWS (device status queue + data plane publish)
      DEVICE_STATUS_QUEUE: ${DEVICE_STATUS_QUEUE}

      # Database
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:-${SERVICE_HEX_32_5}}

      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${SERVICE_HEX_32_6}}

      # Storage (MinIO)
      MINIO_URL: ${MINIO_URL}
      MINIO_EXT_URL: ${MINIO_EXT_URL}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${SERVICE_HEX_32_12}}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Seed data
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-${SERVICE_HEX_32_8}}
      SEED_DEVICE1_KEY: ${SEED_DEVICE1_KEY}
      SEED_DEVICE2_KEY: ${SEED_DEVICE2_KEY}
      SEED_DEVICE1_SECRET: ${SEED_DEVICE1_SECRET:-${SERVICE_HEX_32_9}}
      SEED_DEVICE2_SECRET: ${SEED_DEVICE2_SECRET:-${SERVICE_HEX_32_10}}

      # Springdoc
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED}
    networks:
      hydro-network:
        aliases:
          - api
    deploy:
      resources:
        limits:
          memory: 512m

  postgres:
    image: postgres:16
    restart: on-failure:3
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${SERVICE_HEX_32_5}}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydro-network

  redis:
    image: redis:7-alpine
    restart: on-failure:3
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      hydro-network:
        aliases:
          - redis

  minio:
    image: minio/minio
    container_name: minio_dev
    restart: on-failure:3
    environment:
      MINIO_URL: ${MINIO_URL}
      MINIO_SERVER_URL: ${MINIO_EXT_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${SERVICE_HEX_32_12}}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
    networks:
      - hydro-network
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300m

volumes:
  pgdata:
  cache:
  miniodata:

networks:
  hydro-network:
    driver: bridge