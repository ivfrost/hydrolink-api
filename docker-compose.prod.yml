services:
  api:
    build:
      context: .
      target: production
    restart: on-failure:3
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nanomq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-stage}

      # User secrets
      USER_JWT_SECRET: ${USER_JWT_SECRET:-${SERVICE_HEX_32_1}}
      USER_RECOVERY_SECRET: ${USER_RECOVERY_SECRET:-${SERVICE_HEX_32_2}}
      USER_MQTT_TOKEN_PRIVATE_KEY: ${USER_MQTT_TOKEN_PRIVATE_KEY:?}

      # Device secrets
      DEVICE_KEY_SECRET: ${DEVICE_KEY_SECRET:-${SERVICE_HEX_32_3}}
      DEVICE_PROVISIONING_SECRET: ${DEVICE_PROVISIONING_SECRET:-${SERVICE_HEX_32_11}}

      # MQTT
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://nanomq:1883}
      USER_TOKEN_ISSUER: ${USER_TOKEN_ISSUER:-hydro-api}
      USER_ACCESS_TOKEN_EXPIRATION: ${USER_ACCESS_TOKEN_EXPIRATION:-900000}
      USER_REFRESH_TOKEN_EXPIRATION: ${USER_REFRESH_TOKEN_EXPIRATION:-2592000000}
      USER_MQTT_TOKEN_EXPIRATION: ${USER_MQTT_TOKEN_EXPIRATION:-600000}

      # API MQTT client
      API_MQTT_CLIENT_ID: ${API_MQTT_CLIENT_ID:-hydro-api}
      API_MQTT_USERNAME: ${API_MQTT_USERNAME:-hydro-api-user}
      API_MQTT_PASSWORD: ${API_MQTT_PASSWORD:-${SERVICE_HEX_32_8}}

      # Database
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/hydrodb-stage}
      DB_USERNAME: ${DB_USERNAME:-hydro}
      DB_PASSWORD: ${DB_PASSWORD:-${SERVICE_HEX_32_5}}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${SERVICE_HEX_32_6}}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://hydro.netoasis.dedyn.io}

      # Seed data
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hydro.netoasis.dedyn.io}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-${SERVICE_HEX_32_8}}
      SEED_DEVICE1_KEY: ${SEED_DEVICE1_KEY:-HYDRO-AE720F}
      SEED_DEVICE2_KEY: ${SEED_DEVICE2_KEY:-HYDRO-BB7F1E}
      SEED_DEVICE1_SECRET: ${SEED_DEVICE1_SECRET:-${SERVICE_HEX_32_9}}
      SEED_DEVICE2_SECRET: ${SEED_DEVICE2_SECRET:-${SERVICE_HEX_32_10}}

      # Springdoc
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
    networks:
      hydro-network:
        aliases:
          - api
    deploy:
      resources:
        limits:
          memory: 512m

  postgres:
    image: postgres:16
    restart: on-failure:3
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-hydrodb-stage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydro-network

  redis:
    image: redis:7-alpine
    restart: on-failure:3
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      hydro-network:
        aliases:
          - redis

  nanomq:
    build:
      context: .
      dockerfile: Dockerfile.nanomq
    environment:
      NANOMQ_CONF_PATH: /etc/nanomq/nanomq.conf
    volumes:
      - /data/coolify/proxy/certs/mqtt.hydro.netoasis.dedyn.io:/etc/nanomq/certs
    restart: on-failure:3
    ports:
      - "8883:8883"
      - "8083:8083"
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "1883" ]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hydro-network

  minio:
    image: minio/minio
    container_name: minio_dev
    restart: on-failure:3
    environment:
      MINIO_URL: ${MINIO_URL}
      MINIO_SERVER_URL: ${MINIO_EXT_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
    networks:
      - hydro-network
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300m

volumes:
  pgdata:
  cache:
  miniodata:

networks:
  hydro-network:
    driver: bridge