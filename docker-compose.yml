services:
  postgres:
    image: postgres:16
    container_name: postgres_dev
    restart: on-failure:3
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydro-network

  redis:
    image: redis:7-alpine
    container_name: redis_dev
    restart: on-failure:3
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    labels:
      org.springframework.boot.ignore: true
    volumes:
      - cache:/data
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydro-network

  nanomq:
    image: emqx/nanomq:latest
    container_name: nanomq_dev
    restart: on-failure:3
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
    volumes:
      - ./nanomq.conf:/usr/local/nanomq/nanomq.prod.conf
      - ./mqtt_public_key.pem:/etc/mqtt_public_key.pem
    networks:
      - hydro-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "1883" ]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio_dev
    restart: on-failure:3
    environment:
      MINIO_URL: ${MINIO_URL}
      MINIO_SERVER_URL: ${MINIO_EXT_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
    networks:
      - hydro-network
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300m

volumes:
  pgdata:
  cache:
  miniodata:

networks:
  hydro-network:
    driver: bridge